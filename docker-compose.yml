services:
  postgres:
    image: postgres:16-alpine
    container_name: jharkhand-uddp-postgres
    environment:
      POSTGRES_USER: uddp
      POSTGRES_PASSWORD: uddp_local
      POSTGRES_DB: jharkhand_uddp
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uddp -d jharkhand_uddp"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - jharkhand_uddp_pg:/var/lib/postgresql/data

volumes:
  jharkhand_uddp_pg:
